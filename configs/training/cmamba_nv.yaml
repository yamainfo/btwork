data_config: "mode_1"
model: "CMamba_v1"

name: "CMamba_Trend_Classification"
max_epochs: 1100
use_volume: true
additional_features:
  [
    ema_10,
    ema_30,
    ema_60,
    ema_120,
    ema_diff_60_10,
    ema_diff_120_60,
    rsi_5,
    rsi_14,
    rsi_30,
    rsi_60,
  ]

hyperparams:
  optimizer: "adam"
  lr: 0.001
  lr_step_size: 100
  lr_gamma: 0.5
  weight_decay: 0.0005
  y_key: "trend"
  loss: "bce"
  window_size: 120
